                        char.isTalking = true;
                        char.bubbleText = newMsg;
                        char.bubbleTimer = 300; // ~5 segundos a 60fps
                    }
                });
            } catch (e) {
                // Silence polling errors
            }
        }
        
        // Load commands from server to move agents
        async function loadAgentCommands() {
            try {
                for (let char of characters) {
                    const response = await fetch(`/api/agent/${char.id}/command`);
                    const cmd = await response.json();
                    
                    if (cmd && cmd.action) {
                        console.log(`[Command received] ${char.name}:`, cmd);
                        
                        if (cmd.action === 'move' && cmd.tileX !== undefined && cmd.tileY !== undefined) {
                            const pixelX = cmd.tileX * GRID_SIZE + GRID_SIZE / 2;
                            const pixelY = cmd.tileY * GRID_SIZE + GRID_SIZE / 2;
                            
                            // Check if already at destination
                            const currentTileX = Math.floor(char.x / GRID_SIZE);
                            const currentTileY = Math.floor(char.y / GRID_SIZE);
                            
                            if (currentTileX === cmd.tileX && currentTileY === cmd.tileY) {
                                // Arrived, confirm command
                                fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                                
                                // If command includes sitting after moving
                                if (cmd.sitAfter) {
                                    char.action = ACTIONS.SITTING;
                                    char.sitting = true;
                                    
                                    // Notify backend of arrival and sitting
                                    fetch(`/api/agent/${char.id}/arrived`, { 
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ location: cmd.sitAfter ? 'office' : 'concierge' })
                                    });
                                } else {
                                    // Notify arrival without sitting
                                    fetch(`/api/agent/${char.id}/arrived`, { 
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ location: 'concierge' })
                                    });
                                }
                            } else {
                                // Move to destination
                                char.moveTo(pixelX, pixelY);
                                char.isWaiting = true;
                            }
                            
                            // Mostrar burbuja
                            if (cmd.msg) {
                                char.isTalking = true;
                                char.bubbleText = cmd.msg;
                                char.bubbleTimer = 180;
                            }
                        }
                        else if (cmd.action === 'sit') {
                            char.isWaiting = true;
                            const tx = Math.floor(char.x / GRID_SIZE);
                            const ty = Math.floor(char.y / GRID_SIZE);
                            if (tx === cmd.tileX && ty === cmd.tileY) {
                                char.action = ACTIONS.SITTING;
                                char.sitting = true;
                                fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                            }
                        }
                        else if (cmd.action === 'idle') {
                            char.isWaiting = false;
                            fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                        }
                    }
                }
            } catch (e) {
                console.error('Error en loadAgentCommands:', e);
            }
        }
        
        // Poll every 1 second for faster response
        setInterval(() => {
            loadAgentMessages();
            loadAgentCommands();
        }, 1000);
        loadAgentMessages();
        loadAgentCommands();

        // === SISTEMA DE LOG ===
        const tabChat = document.getElementById('tabChat');
        const tabLog = document.getElementById('tabLog');
        const viewChat = document.getElementById('viewChat');
        const viewLog = document.getElementById('viewLog');
        const logEntries = document.getElementById('logEntries');

        // Log filters
        let logFilters = {}; // Populated dynamically by initLogSystem()
        let allLogs = []; // Cache de todos los logs

        const filterButtons = {
            // Filter buttons populated dynamically by initLogSystem()
        };

        const filterStyles = {
            0: { active: 'rgba(59, 130, 246, 0.1)' },
            1: { active: 'rgba(249, 115, 22, 0.15)' },
            2: { active: 'rgba(34, 197, 94, 0.1)' }
        };

        function toggleLogFilter(agentId) {
            logFilters[agentId] = !logFilters[agentId];
            updateFilterButtons();
            // Re-render logs with applied filters
            renderLogs();
        }

        function updateFilterButtons() {
            Object.entries(filterButtons).forEach(([id, btn]) => {
                if (!btn) return;
                const active = logFilters[id];
                const style = filterStyles[id] || { active: 'rgba(107, 114, 128, 0.2)' };
                btn.style.opacity = active ? '1' : '0.4';
                btn.style.background = active ? style.active : 'transparent';
            });
        }

        function renderLogs() {
            logEntries.innerHTML = '';
            
            const filteredLogs = allLogs.filter(log => logFilters[log.agent] ?? false);
            
            if (filteredLogs.length === 0) {
                const activeFilters = Object.values(logFilters).some(Boolean);
                const noLogsMsg = (!activeFilters) 
                    ? 'Select at least one filter' 
                    : 'No entries for this filter';
                logEntries.innerHTML = `<div style="color: #6b7280; text-align: center; padding: 20px;">${noLogsMsg}</div>`;
                return;
            }
            
            filteredLogs.forEach(log => {
                if (!log.time || log.agent === undefined) return;
                
                const entry = document.createElement('div');
                entry.style.cssText = 'display: flex; align-items: flex-start; gap: 8px; padding: 8px; margin-bottom: 8px; background: rgba(31, 41, 55, 0.5); border-left: 2px solid; border-radius: 4px;';
                
                const agentMeta = {
                    // AGENT_COLORS populated dynamically by initLogSystem()
                }[log.agent] || { name: `Agent ${log.agent}`, color: '#6b7280', text: '#9ca3af' };
                
                entry.style.borderLeftColor = agentMeta.color;
                
                const msg = log.msg || log.action || 'No message';
                
                entry.innerHTML = `
                    <span style="color: #6b7280; font-size: 10px; white-space: nowrap;">${log.time}</span>
                    <span style="color: ${agentMeta.text}; font-weight: bold;">[${agentMeta.name}]</span>
                    <span style="color: #d1d5db;">${msg}</span>
                `;
                
                logEntries.appendChild(entry);
            });
            
            // Scroll to bottom
            const container = document.getElementById('logContainer');
            if (container) container.scrollTop = container.scrollHeight;
        }

        const tabEmail = document.getElementById('tabEmail');
        const viewEmail = document.getElementById('viewEmail');
        const tabContacts = document.getElementById('tabContacts');
        const viewContacts = document.getElementById('viewContacts');

        function setActiveTab(active) {
            // Reset all tabs
            [tabChat, tabLog, tabEmail, tabContacts].forEach(t => {
                t.classList.remove('text-blue-400', 'border-b-2', 'border-blue-400');
                t.classList.add('text-gray-400');
            });
            // Hide all views
            viewChat.classList.add('hidden');
            viewLog.classList.add('hidden');
            viewEmail.classList.add('hidden');
            viewContacts.classList.add('hidden');
            // Activate selected
            active.classList.add('text-blue-400', 'border-b-2', 'border-blue-400');
            active.classList.remove('text-gray-400');
        }

        // Switch between tabs
        tabChat.addEventListener('click', () => {
            setActiveTab(tabChat);
            viewChat.classList.remove('hidden');
        });

        tabLog.addEventListener('click', () => {
            setActiveTab(tabLog);
            viewLog.classList.remove('hidden');
            refreshLog();
        });

        tabEmail.addEventListener('click', () => {
            setActiveTab(tabEmail);
            viewEmail.classList.remove('hidden');
            refreshEmail();
        });

        tabContacts.addEventListener('click', () => {
            setActiveTab(tabContacts);
            viewContacts.classList.remove('hidden');
            loadSyncStatus();
            document.getElementById('contactSearch').focus();
        });

        // Load log from API (consistent format)
        async function refreshLog() {
            try {
                const response = await fetch('/api/log');
                const logs = await response.json();
                
                // Save to cache
                allLogs = logs;
                
                if (!Object.values(logFilters).some(Boolean)) {
                    logFilters = { 0: true, 1: true, 2: true };
                    updateFilterButtons();
                }
                
                // Render with applied filters
                renderLogs();
                
            } catch (e) {
                console.error('Error loading log:', e);
                const errMsg = (e && e.message) ? e.message : 'Desconocido';
                logEntries.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 20px;">Error loading log<br><span style='font-size:11px;color:#9ca3af;'>${errMsg}</span></div>`;
                setTimeout(() => {
                    if (!viewLog.classList.contains('hidden')) {
                        refreshLog();
                    }
                }, 3000);
            }
        }

        function clearLog() {
            logEntries.innerHTML = '<div class="text-gray-500 text-center py-4">Log cleared</div>';
        }

        // Refresh log every 2 seconds if visible
        setInterval(() => {
            if (!viewLog.classList.contains('hidden')) {
                refreshLog();
            }
        }, 2000);

        updateFilterButtons();

        // === Email Panel Logic ===
        let emailCache = [];
        let emailRefreshTimer = null;
        let emailAccounts = [];
        let emailCategories = [];
        let selectedAccountId = null;
        let selectedCategory = 'all';

        async function loadEmailAccounts() {
            try {
                const res = await fetch('/api/email/accounts');
                const data = await res.json();
                emailAccounts = data.accounts || [];
                emailCategories = data.categories || [];
                renderAccountChips();
            } catch (e) {
                console.error('Failed to load email accounts:', e);
            }
        }

        function renderAccountChips() {
            const chipsEl = document.getElementById('emailAccountChips');
            if (!chipsEl) return;
            const filtered = selectedCategory === 'all'
                ? emailAccounts
                : emailAccounts.filter(a => a.category === selectedCategory);
            if (!filtered.length) {
                chipsEl.innerHTML = '<span style="color: #6b7280; font-size: 11px; padding: 4px 8px;">No accounts in this category</span>';
                return;
            }
            chipsEl.innerHTML = filtered.map(a => {
                const isSelected = a.id === selectedAccountId;
                const bg = isSelected ? (a.color || '#2563eb') : '#374151';
                const opacity = a.configured ? '1' : '0.4';
                return `<button class="email-account-chip" data-id="${a.id}" style="white-space: nowrap; font-size: 11px; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; background: ${bg}; color: white; opacity: ${opacity}; display: flex; align-items: center; gap: 4px;">
                    <span>${a.icon || '📧'}</span>
                    <span>${escapeHtml(a.name)}</span>
                    <span id="chip-unread-${a.id}" style="font-size: 9px; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 1px 5px; display: none;"></span>
                </button>`;
            }).join('');
            chipsEl.querySelectorAll('.email-account-chip').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const acct = emailAccounts.find(a => a.id === id);
                    if (acct && !acct.configured) return;
                    selectedAccountId = id;
                    renderAccountChips();
                    refreshEmail();
                });
            });
        }

        // Category tab handlers
        document.querySelectorAll('.email-cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.email-cat-btn').forEach(b => {
                    b.style.background = '#374151';
                    b.style.color = '#d1d5db';
                });
                btn.style.background = '#2563eb';
                btn.style.color = 'white';
                selectedCategory = btn.dataset.cat;
                selectedAccountId = null;
                renderAccountChips();
                // Auto-select first account in category
                const filtered = selectedCategory === 'all'
                    ? emailAccounts.filter(a => a.configured)
                    : emailAccounts.filter(a => a.category === selectedCategory && a.configured);
                if (filtered.length) {
                    selectedAccountId = filtered[0].id;
                    renderAccountChips();
                    refreshEmail();
                } else {
                    const listEl = document.getElementById('emailList');
                    if (listEl) listEl.innerHTML = '<div style="padding: 16px; font-size: 12px; color: #6b7280; text-align: center;">No configured accounts in this category</div>';
                }
            });
        });

        async function refreshEmail() {
            const listEl = document.getElementById('emailList');
            if (!listEl) return;
            if (!selectedAccountId) {
                listEl.innerHTML = '<div style="padding: 16px; font-size: 12px; color: #6b7280; text-align: center;">Select an account to view inbox</div>';
                return;
            }
            const acct = emailAccounts.find(a => a.id === selectedAccountId);
            listEl.innerHTML = `<div style="padding: 12px; font-size: 12px; color: #6b7280; text-align: center; border-bottom: 1px solid #374151;">${acct ? acct.icon + ' ' + escapeHtml(acct.name) : ''} — Loading...</div>`;
            try {
                const res = await fetch(`/api/email/inbox?limit=20&account=${selectedAccountId}`);
                const data = await res.json();
                if (data.error) {
                    listEl.innerHTML = `<div class="text-red-400 text-center py-4 text-xs">Error: ${data.error}</div>`;
                    return;
                }
                emailCache = data.emails || [];
                renderEmailList(emailCache);
            } catch (e) {
                listEl.innerHTML = `<div class="text-red-400 text-center py-4 text-xs">Connection error: ${e.message}</div>`;
            }
        }

        function renderEmailList(emails) {
            const listEl = document.getElementById('emailList');
            if (!emails.length) {
                listEl.innerHTML = '<div class="text-gray-500 text-center py-4 text-xs">No emails found</div>';
                return;
            }
            listEl.innerHTML = emails.map(e => {
                const dateStr = e.date ? new Date(e.date).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
                const unreadClass = e.seen ? 'opacity-60' : 'border-l-2 border-blue-400';
                return `<div class="email-item p-2.5 border-b border-gray-700 cursor-pointer hover:bg-gray-700/50 transition-colors ${unreadClass}" data-id="${e.id}">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-gray-200 truncate flex-1">${escapeHtml(e.from || '?')}</span>
                        <span class="text-[10px] text-gray-500 ml-2 flex-shrink-0">${dateStr}</span>
                    </div>
                    <div class="text-xs text-gray-400 truncate">${escapeHtml(e.subject || '(no subject)')}</div>
                </div>`;
            }).join('');

            // Attach click handlers
            listEl.querySelectorAll('.email-item').forEach(el => {
                el.addEventListener('click', () => openEmail(el.dataset.id));
            });
        }

        async function openEmail(id) {
            const detailEl = document.getElementById('emailDetail');
            const listEl = document.getElementById('emailList');
            if (!detailEl) return;
            detailEl.innerHTML = '<div class="text-gray-500 text-center py-4 text-xs">Loading...</div>';
            listEl.classList.add('hidden');
            detailEl.classList.remove('hidden');
            document.getElementById('emailBackBtn').classList.remove('hidden');

            try {
                const acctParam = selectedAccountId ? `?account=${selectedAccountId}` : '';
                const res = await fetch(`/api/email/${id}${acctParam}`);
                const data = await res.json();
                if (data.error) {
                    detailEl.innerHTML = `<div class="text-red-400 text-center py-4 text-xs">Error: ${data.error}</div>`;
                    return;
                }
                const dateStr = data.date ? new Date(data.date).toLocaleString() : '';
                detailEl.innerHTML = `
                    <div class="p-3 border-b border-gray-700">
                        <div class="text-sm font-bold text-gray-100 mb-1">${escapeHtml(data.subject || '(no subject)')}</div>
                        <div class="text-xs text-gray-400 mb-1">From: ${escapeHtml(data.from || '?')}</div>
                        <div class="text-xs text-gray-400 mb-1">To: ${escapeHtml(data.to || '?')}</div>
                        <div class="text-[10px] text-gray-500">${dateStr}</div>
                    </div>
                    <div class="p-3 text-xs text-gray-300 whitespace-pre-wrap overflow-y-auto" style="max-height: 400px;">${escapeHtml(data.body || '(empty)')}</div>
                `;
            } catch (e) {
                detailEl.innerHTML = `<div class="text-red-400 text-center py-4 text-xs">Error: ${e.message}</div>`;
            }
        }

        function closeEmail() {
            document.getElementById('emailList').classList.remove('hidden');
            document.getElementById('emailDetail').classList.add('hidden');
            document.getElementById('emailBackBtn').classList.add('hidden');
        }

        async function pollUnread() {
            try {
                const res = await fetch('/api/email/unread/all');
                const data = await res.json();
                let totalUnread = 0;
                Object.entries(data).forEach(([id, info]) => {
                    const count = info.unread || 0;
                    totalUnread += count;
                    const chipBadge = document.getElementById(`chip-unread-${id}`);
                    if (chipBadge) {
                        if (count > 0) {
                            chipBadge.textContent = count > 99 ? '99+' : count;
                            chipBadge.style.display = 'inline';
                        } else {
                            chipBadge.style.display = 'none';
                        }
                    }
                });
                const badge = document.getElementById('emailBadge');
                if (totalUnread > 0) {
                    badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            } catch (e) {
                // silently fail
            }
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s || '';
            return div.innerHTML;
        }

        // Load accounts on startup, then poll unread counts
        loadEmailAccounts();
        pollUnread();
        setInterval(pollUnread, 60000);

        // === Contacts Panel Logic ===
        let contactSearchTimer = null;

        document.getElementById('contactSearch').addEventListener('input', (e) => {
            clearTimeout(contactSearchTimer);
            const term = e.target.value.trim();
            if (term.length < 2) {
                document.getElementById('contactList').innerHTML = '<div style="padding:16px;font-size:12px;color:#6b7280;text-align:center;">Type to search contacts...</div>';
                return;
            }
            contactSearchTimer = setTimeout(() => searchContacts(term), 300);
        });

        async function searchContacts(term) {
            const listEl = document.getElementById('contactList');
            listEl.innerHTML = '<div style="padding:16px;font-size:12px;color:#6b7280;text-align:center;">Searching...</div>';
            try {
                const res = await fetch('/api/contacts/search?q=' + encodeURIComponent(term) + '&limit=20');
                const data = await res.json();
                if (data.error) { listEl.innerHTML = '<div style="color:#ef4444;text-align:center;padding:16px;font-size:12px;">' + data.error + '</div>'; return; }
                renderContactList(data.results || []);
            } catch (e) {
                listEl.innerHTML = '<div style="color:#ef4444;text-align:center;padding:16px;font-size:12px;">Connection error</div>';
            }
        }

        function renderContactList(contacts) {
            const listEl = document.getElementById('contactList');
            if (!contacts.length) {
                listEl.innerHTML = '<div style="padding:16px;font-size:12px;color:#6b7280;text-align:center;">No contacts found</div>';
                return;
            }
            listEl.innerHTML = contacts.map(c => {
                const email = c.emails[0] || '';
                const org = c.organizations[0] || '';
                const platformDots = ['crm','odoo','openproject','nextcloud','paperless'].map(p => {
                    // We don't have platform info in search results, just show CRM dot
                    return '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#374151;margin-right:2px;" title="' + p + '"></span>';
                }).join('');
                return '<div class="contact-item" style="padding:10px 12px;border-bottom:1px solid #1f2937;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background=\'#1f2937\'" onmouseout="this.style.background=\'transparent\'" data-id="' + c.id + '">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">' +
                    '<span style="font-size:12px;font-weight:bold;color:#d1d5db;">' + escapeHtml(c.displayName) + '</span>' +
                    '<span style="font-size:10px;color:#4b5563;">' + platformDots + '</span>' +
                    '</div>' +
                    (email ? '<div style="font-size:10px;color:#6b7280;">' + escapeHtml(email) + '</div>' : '') +
                    (org ? '<div style="font-size:10px;color:#4b5563;">' + escapeHtml(org) + '</div>' : '') +
                    '</div>';
            }).join('');

            listEl.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', () => openContact(el.dataset.id));
            });
        }

        async function openContact(id) {
            const detailEl = document.getElementById('contactDetail');
            const listEl = document.getElementById('contactList');
            detailEl.innerHTML = '<div style="padding:16px;font-size:12px;color:#6b7280;text-align:center;">Loading...</div>';
            listEl.classList.add('hidden');
            detailEl.classList.remove('hidden');
            document.getElementById('contactBackBtn').classList.remove('hidden');

            try {
                const res = await fetch('/api/contacts/' + id);
                const c = await res.json();
                if (c.error) { detailEl.innerHTML = '<div style="color:#ef4444;padding:16px;font-size:12px;">' + c.error + '</div>'; return; }

                const platformBadges = Object.entries(c.platforms || {}).map(([name, info]) => {
                    const color = info.present ? '#22c55e' : '#374151';
                    const label = info.present ? (name + ':' + info.id) : name + ':missing';
                    return '<span style="display:inline-flex;align-items:center;gap:4px;background:' + color + '20;border:1px solid ' + color + '40;border-radius:3px;padding:2px 6px;font-size:10px;color:' + color + ';margin-right:4px;margin-bottom:2px;">' +
                        '<span style="width:6px;height:6px;border-radius:50%;background:' + color + ';"></span>' + label + '</span>';
                }).join('');

                const emails = (c.emails || []).map(e =>
                    '<div style="font-size:11px;color:#9ca3af;">' + escapeHtml(e.email) + ' <span style="color:#4b5563;">(' + (e.label || 'email') + ')</span></div>'
                ).join('');

                const phones = (c.phones || []).map(p =>
                    '<div style="font-size:11px;color:#9ca3af;">' + escapeHtml(p.phone) + ' <span style="color:#4b5563;">(' + (p.label || 'phone') + ')</span></div>'
                ).join('');

                const orgs = (c.organizations || []).map(o =>
                    '<div style="font-size:11px;color:#9ca3af;">' + escapeHtml(o.name) + '</div>'
                ).join('');

                detailEl.innerHTML =
                    '<div style="padding:12px;border-bottom:1px solid #1f2937;">' +
                    '<div style="font-size:14px;font-weight:bold;color:#e5e7eb;margin-bottom:4px;">' + escapeHtml(c.displayName) + '</div>' +
                    '<div style="font-size:10px;color:#6b7280;margin-bottom:8px;">Source: ' + escapeHtml(c.source || 'unknown') + ' | Type: ' + escapeHtml(c.type) + '</div>' +
                    '<div style="margin-bottom:8px;"><div style="font-size:10px;color:#4b5563;margin-bottom:2px;">PLATFORMS</div>' + platformBadges + '</div>' +
                    (emails ? '<div style="margin-bottom:6px;"><div style="font-size:10px;color:#4b5563;margin-bottom:2px;">EMAIL</div>' + emails + '</div>' : '') +
                    (phones ? '<div style="margin-bottom:6px;"><div style="font-size:10px;color:#4b5563;margin-bottom:2px;">PHONE</div>' + phones + '</div>' : '') +
                    (orgs ? '<div style="margin-bottom:6px;"><div style="font-size:10px;color:#4b5563;margin-bottom:2px;">ORGANIZATIONS</div>' + orgs + '</div>' : '') +
                    (c.notes ? '<div style="margin-bottom:6px;"><div style="font-size:10px;color:#4b5563;margin-bottom:2px;">NOTES</div><div style="font-size:11px;color:#9ca3af;">' + escapeHtml(c.notes) + '</div></div>' : '') +
                    '</div>';

                // Load interactions
                try {
                    const iRes = await fetch('/api/contacts/' + id + '/interactions');
                    const iData = await iRes.json();
                    if (iData.interactions && iData.interactions.length) {
                        const iHtml = iData.interactions.map(i =>
                            '<div style="padding:8px 12px;border-bottom:1px solid #1f2937;">' +
                            '<div style="font-size:11px;color:#d1d5db;">' + escapeHtml(i.summary || i.type) + '</div>' +
                            '<div style="font-size:10px;color:#6b7280;">' + escapeHtml(i.date || '') + ' | ' + escapeHtml(i.type) + '</div>' +
                            (i.details ? '<div style="font-size:10px;color:#4b5563;margin-top:2px;">' + escapeHtml(i.details.substring(0, 200)) + '</div>' : '') +
                            '</div>'
                        ).join('');
                        detailEl.innerHTML += '<div style="padding:8px 12px;border-top:1px solid #374151;"><div style="font-size:10px;color:#4b5563;margin-bottom:4px;">INTERACTIONS (' + iData.interactions.length + ')</div></div>' + iHtml;
                    }
                } catch (e) {}

            } catch (e) {
                detailEl.innerHTML = '<div style="color:#ef4444;padding:16px;font-size:12px;">Error: ' + e.message + '</div>';
            }
        }

        function closeContact() {
            document.getElementById('contactList').classList.remove('hidden');
            document.getElementById('contactDetail').classList.add('hidden');
            document.getElementById('contactBackBtn').classList.add('hidden');
        }

        async function loadSyncStatus() {
            const bar = document.getElementById('syncStatusBar');
            try {
                const res = await fetch('/api/sync/status');
                const s = await res.json();
                if (s.error) { document.getElementById('syncStatusText').textContent = 'Sync: unavailable'; return; }
                const last = s.lastSync ? new Date(s.lastSync).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'never';
                document.getElementById('syncStatusText').innerHTML =
                    '<span style="color:#6b7280;">CRM:' + s.crm.contacts + '</span> ' +
                    '<span style="color:#6b7280;">| Odoo:' + s.mappings.odoo + '</span> ' +
                    '<span style="color:#6b7280;">| OP:' + s.mappings.openproject + '</span> ' +
                    '<span style="color:#6b7280;">| NC:' + s.mappings.nextcloud + '</span> ' +
                    '<span style="color:#6b7280;">| PL:' + s.mappings.paperless + '</span> ' +
                    '<span style="color:#4b5563;">| Last:' + last + '</span>';
            } catch (e) {
                document.getElementById('syncStatusText').textContent = 'Sync: connection error';
            }
        }

        // Start
        gameLoop();
    </script>
</body>
</html>
